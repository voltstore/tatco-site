  <symbol id="i-whatsapp" viewBox="0 0 32 32" fill="currentColor">
    <path d="M16.04 4C9.46 4 4.13 9.32 4.13 15.9c0 2.1.55 4.07 1.5 5.78L4 28l6.49-1.6a11.86 11.86 0 0 0 5.55 1.4h.01c6.58 0 11.91-5.32 11.91-11.9C27.96 9.31 22.63 4 16.04 4Zm0 21.66h-.01a9.7 9.7 0 0 1-4.95-1.36l-.36-.21-3.85.95.99-3.75-.23-.39a9.65 9.65 0 0 1-1.49-5.1c0-5.36 4.37-9.72 9.91-9.72 2.65 0 5.13 1.03 7 2.9a9.79 9.79 0 0 1 2.9 6.95c0 5.36-4.37 9.73-9.91 9.73Zm5.43-7.28c-.3-.15-1.76-.87-2.03-.96-.27-.1-.47-.15-.67.15-.2.3-.77.96-.94 1.16-.17.2-.35.22-.65.07-.3-.15-1.25-.46-2.39-1.47a8.97 8.97 0 0 1-1.65-2.05c-.17-.3-.02-.46.13-.61.13-.13.3-.35.45-.52.15-.17.2-.3.3-.5.1-.2.05-.37-.02-.52-.08-.15-.67-1.62-.92-2.22-.24-.58-.49-.5-.67-.51h-.57c-.2 0-.52.07-.79.37-.27.3-1.04 1.02-1.04 2.48s1.07 2.88 1.22 3.08c.15.2 2.1 3.21 5.09 4.5.71.31 1.27.49 1.7.62.71.23 1.36.2 1.87.12.57-.08 1.76-.72 2-1.42.25-.7.25-1.3.17-1.42-.07-.13-.27-.2-.57-.35Z"/>
  </symbol>

  <!-- سهم اتجاه -->
  <symbol id="i-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 12h14M13 6l6 6-6 6"/>
  </symbol>

  <!-- دبوس موقع -->
  <symbol id="i-pin" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 21s7-6.1 7-11.2A7 7 0 0 0 5 9.8C5 14.9 12 21 12 21Z"/>
    <circle cx="12" cy="9.6" r="2.6"/>
  </symbol>

  <!-- مغلف بريد -->
  <symbol id="i-mail" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <rect x="3" y="5" width="18" height="14" rx="1.5"/>
    <path d="m4 7 8 6 8-6"/>
  </symbol>

  <!-- سماعة هاتف -->
  <symbol id="i-phone" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6.5 3h3l1.5 4.5-2.2 2A14 14 0 0 0 14.5 15l2-2.2L21 14.5v3a2 2 0 0 1-2.2 2A18 18 0 0 1 4.5 5.2 2 2 0 0 1 6.5 3Z"/>
  </symbol>

  <!-- الحاويات/الصناديق (لتزيين الأقسام) -->
  <symbol id="i-crates" viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round">
    <rect x="6" y="30" width="20" height="20"/>
    <rect x="30" y="22" width="28" height="28"/>
    <path d="M6 40h20M16 30v20M30 36h28M44 22v28" opacity=".5"/>
  </symbol>

</svg>
