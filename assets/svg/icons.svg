<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <!-- شعار TATCO المختصر: حرف T مكوّن من خطوط مسار + نقاط الهوية الثلاث -->
  <symbol id="i-logo" viewBox="0 0 40 40" fill="none">
    <path d="M6 11h28M20 11v22" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/>
    <circle cx="6" cy="11" r="2.6" fill="var(--orange,#df6a2e)"/>
    <circle cx="34" cy="11" r="2.6" fill="var(--olive,#5c6b4f)"/>
    <circle cx="20" cy="33" r="2.6" fill="var(--paper,#f3efe7)"/>
  </symbol>

  <!-- شاحنة نقل -->
  <symbol id="i-truck" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M4 13h22v20H4z"/>
    <path d="M26 21h9l8 6v6h-3"/>
    <path d="M26 33h-1"/>
    <circle cx="13" cy="36" r="3.4"/>
    <circle cx="35" cy="36" r="3.4"/>
    <path d="M4 18h14M4 28h14" opacity=".4"/>
  </symbol>

  <!-- تخليص جمركي: ختم/مستند -->
  <symbol id="i-customs" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M13 6h17l7 7v29H13z"/>
    <path d="M30 6v7h7"/>
    <path d="M19 24h12M19 30h12M19 36h7"/>
    <circle cx="22" cy="18" r="3.2"/>
    <path d="M19 18h-2M28 18h2"/>
  </symbol>

  <!-- تخزين: مستودع / صناديق -->
  <symbol id="i-warehouse" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M5 20 24 8l19 12v22H5z"/>
    <path d="M16 42V26h16v16"/>
    <path d="M5 20h38" opacity=".35"/>
  </symbol>

  <!-- شحن بحري / ميناء -->
  <symbol id="i-port" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M8 30V14h8v16M20 30V20h8v10M32 30v-7h8v7"/>
    <path d="M4 30h40l-4 9H8z"/>
    <path d="M24 14V6M21 8h6" opacity=".5"/>
  </symbol>

  <!-- شبكة طرق / توزيع -->
  <symbol id="i-route" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="9" cy="12" r="3.4"/>
    <circle cx="39" cy="12" r="3.4"/>
    <circle cx="24" cy="38" r="3.4"/>
    <path d="M12 14 22 36M36 14 26 36M12 12h24" stroke-dasharray="3 3.4" opacity=".7"/>
  </symbol>

  <!-- جدولة / دقة في الوقت -->
  <symbol id="i-clock" viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="24" cy="25" r="16"/>
    <path d="M24 16v9l7 5"/>
    <path d="M18 5h12" />
  </symbol>

